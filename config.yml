conversation_model_name: qwen2.5:7b-instruct      # qwen2.5         # gemma4:e2b        
conversation_temperature: 1
conversation_keep_alive: 3m
conversation_reasoning: True

conversation_theme: kennismaken          # options: winkelen, kennismaken, wonen
language_level: A2
input_format: speech                       # speech or text
output_format: speech                      # speech or text

talking_head: pytoon                          # options: uit, pytoon, makeittalk
tts_engine: piper                           # options: piper, gtts

language_check_mode: regels                    # options: uit, llm, regels
language_check_rules: [woordvolgorde, vervoeging]          # options: woordvolgorde, vervoeging
correct_errors: True                           # True = ask the LLM to correct recorded word-order and conjugation mistakes after the conversation

checker_model_name: qwen2.5:7b-instruct           # used when language_check_mode is llm
checker_temperature: 0
checker_keep_alive: 3m 
checker_reasoning: True

piper_model_path: voices/nl_NL-ronnie-medium.onnx
piper_config_path: voices/nl_NL-ronnie-medium.onnx.json
tts_speaker_id: null    # Used in the case of multiple speakers.